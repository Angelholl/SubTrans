<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SubTrans 2.7.4 设计原型 · 导读页信息架构 + 批量修复确认框</title>
<style>
:root {
    --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F9FAFB; --surface-3:#F3F4F6;
    --border:#E5E7EB; --border-strong:#D1D5DB;
    --text-1:#111827; --text-2:#6B7280; --text-3:#9CA3AF;
    --primary:#3B82F6; --primary-strong:#2563EB; --primary-soft:#EFF6FF; --primary-border:#BFDBFE;
    --ok:#10B981; --ok-soft:#ECFDF5;
    --warn:#F59E0B; --warn-soft:#FFFBEB;
    --danger:#DC2626; --danger-soft:#FEF2F2; --danger-soft-hover:#FEE2E2; --danger-border:#FECACA;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --shadow-md:0 2px 4px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.08);
    --radius-sm:8px; --radius:12px; --radius-lg:16px; --radius-pill:999px;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
    --h-ctl:36px; --h-ctl-sm:30px;
    --dur-fast:.12s; --dur:.15s;
    --font:14px; --font-sm:13px; --font-xs:12px;
    --font-mono:"Cascadia Code", Consolas, "JetBrains Mono", monospace;
    --font-sans:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --status-warn:#B26A00;
}
[data-theme="dark"] {
    --bg:#0B0F17; --surface:#141821; --surface-2:#1A202B; --surface-3:#1F2530;
    --border:#262D3B; --border-strong:#333C4D;
    --text-1:#E5E7EB; --text-2:#9CA3AF; --text-3:#6B7280;
    --primary:#60A5FA; --primary-strong:#3B82F6; --primary-soft:rgba(59,130,246,.14); --primary-border:rgba(96,165,250,.35);
    --ok:#34D399; --ok-soft:rgba(16,185,129,.12);
    --warn:#FBBF24; --warn-soft:rgba(245,158,11,.12);
    --danger:#F87171; --danger-soft:rgba(239,68,68,.12); --danger-soft-hover:rgba(239,68,68,.22); --danger-border:rgba(248,113,113,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 2px 4px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.4);
    --status-warn:var(--warn);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:var(--font-sans); font-size:var(--font); line-height:1.55;
    color:var(--text-1); background:var(--bg); transition:background .25s ease, color .25s ease;
}
button { font-family:inherit; cursor:pointer; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:8px; }

/* 顶部演示工具条（原型专用，不属于交付组件） */
.proto-toolbar {
    display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap;
    padding:10px 18px; background:var(--surface); border-bottom:1px solid var(--border);
    font-size:var(--font-xs); color:var(--text-2);
}
.proto-toolbar .proto-title { font-weight:650; color:var(--text-1); font-size:var(--font-sm); }
.proto-demo-ctl { display:flex; align-items:center; gap:var(--space-1); flex-wrap:wrap; }
.proto-demo-ctl .ctl-label { font-weight:600; }
.proto-demo-ctl .btn-sm { min-height:26px; padding:0 8px; }

/* 按钮族 —— 照抄 style.css:811-865 */
.btn {
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    min-height:var(--h-ctl); padding:0 14px; font-size:var(--font-sm); font-weight:550;
    border-radius:9px; border:1px solid transparent; background:transparent; color:var(--text-1);
    transition:all var(--dur) ease; white-space:nowrap; cursor:pointer;
}
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn-primary { background:var(--primary); color:#fff; box-shadow:0 1px 2px rgba(37,99,235,.3); }
.btn-primary:hover:not(:disabled) { background:var(--primary-strong); }
.btn-secondary { background:var(--surface); color:var(--text-1); border-color:var(--border-strong); }
.btn-secondary:hover:not(:disabled) { background:var(--surface-2); }
.btn-ghost { background:transparent; color:var(--text-2); }
.btn-ghost:hover:not(:disabled) { background:var(--surface-3); color:var(--text-1); }
.btn-sm, .btn-compact { min-height:var(--h-ctl-sm); padding:0 10px; font-size:var(--font-xs); border-radius:var(--radius-sm); }
/* 质量页导读卡 —— 对齐 style.css:1657-1739 现有语言 */
.page-wrap { display:flex; justify-content:center; padding:var(--space-4); }
.guide-page { width:100%; max-width:880px; display:flex; flex-direction:column; gap:var(--space-3); }
.section { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); }
.summary {
    display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap;
    padding:var(--space-3) 18px; font-weight:650; font-size:var(--font); color:var(--text-1); cursor:pointer;
    user-select:none;
}
.section-title-text { flex-shrink:0; }
.guide-chevd { display:inline-flex; align-items:center; color:var(--text-3); transition:transform .2s ease; flex-shrink:0; }
.det-closed .guide-chevd { transform:rotate(-90deg); }
.section-content { padding:var(--space-2) 18px var(--space-3); display:flex; flex-direction:column; gap:var(--space-2); }
.det-closed .section-content { display:none; }

/* 媒体来源条（卡头折叠态 / 展开编辑态） */
.media-source-bar {
    display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap;
    padding:var(--space-2) 10px; border:1px solid var(--border); border-radius:10px; background:var(--surface);
}
.summary .media-source-bar {
    border:none; padding:0; background:transparent; flex-wrap:nowrap;
    max-width:360px; min-width:0;
}
.media-source-label { font-size:var(--font-xs); font-weight:600; white-space:nowrap; color:var(--text-2); flex-shrink:0; }
.media-source-tag { font-size:11px; padding:1px var(--space-2); border-radius:var(--radius-pill); white-space:nowrap; flex-shrink:0; }
.media-source-tag.tag-auto   { color:var(--ok); background:var(--ok-soft); }
.media-source-tag.tag-explicit{ color:var(--primary-strong); background:var(--primary-soft); }
.media-source-tag.tag-none   { color:var(--status-warn); background:var(--warn-soft); }
.media-source-path {
    font-size:var(--font-xs); color:var(--text-2); flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.media-source-edit-row { display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap; padding:0 10px; }
.form-input {
    height:var(--h-ctl); padding:0 var(--space-3); border:1px solid var(--border-strong);
    border-radius:9px; background:var(--surface); color:var(--text-1); font-size:var(--font-sm);
}
.grow { flex:1; min-width:0; }
/* 状态行（两槽合一后的信息行） */
.status-line {
    display:flex; align-items:center; gap:var(--space-2); min-width:0;
    font-size:var(--font-xs); color:var(--text-2); margin-bottom:var(--space-2);
}
.status-line .status-path {
    font-family:var(--font-mono); font-size:11px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:100%; min-width:0;
}
.status-line.status-err { color:var(--danger); }
.status-line.status-err .status-path { color:var(--danger); }
.pv-ico-ok { color:var(--ok); display:inline-flex; flex-shrink:0; }
.copy-btn { flex-shrink:0; margin-left:auto; }
.copy-btn.copied { color:var(--ok); }
.source-chip { display:inline-flex; align-items:center; gap:var(--space-1); font-size:var(--font-xs); padding:1px var(--space-2); border-radius:var(--radius-pill); color:var(--primary-strong); background:var(--primary-soft); flex-shrink:0; }

/* 导读结构化块：区块重排（CSS order，零 DOM 移动） */
.json-blocks { display:flex; flex-direction:column; gap:var(--space-4); }
.json-blocks .lb-items      { order:1; }
.json-blocks .lb-concl      { order:2; }
.json-blocks .lb-sections   { order:3; }
.json-blocks .lb-companions { order:4; }
.json-blocks .lb-meta       { order:5; }
.block-head { display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap; }
.block-title { font-size:var(--font-sm); font-weight:650; color:var(--text-1); }
.block-title.main { font-size:var(--font); }
.count-chip { font-size:var(--font-xs); font-weight:600; padding:1px var(--space-2); border-radius:var(--radius-pill); color:var(--text-2); background:var(--surface-3); flex-shrink:0; }
.sect-toggle { background:none; border:none; display:inline-flex; align-items:center; color:var(--text-3); margin-left:auto; padding:2px; border-radius:var(--radius-sm); }
.sect-toggle:hover { background:var(--surface-3); color:var(--text-1); }
.sect-toggle.open .guide-chevd { transform:rotate(-180deg); }
/* 行动条目 —— 页面主体（行内三段：头行 + 消息 + 现译） */
.items-list { display:flex; flex-direction:column; gap:var(--space-1); margin-top:var(--space-2); }
.guide-item {
    border:1px solid var(--border); border-left:3px solid transparent;
    border-radius:var(--radius-sm); background:var(--surface);
    padding:var(--space-2) var(--space-3);
    display:flex; flex-direction:column; gap:var(--space-1);
}
.guide-item:hover { background:var(--surface-2); }
.guide-item.guide-item-missed { border-left-color:var(--warn); background:var(--warn-soft); }
.item-head { display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap; min-width:0; }
.idx-chip { font-family:var(--font-mono); font-size:var(--font-xs); font-weight:600; color:var(--text-1); flex-shrink:0; }
.cat-chip { font-size:var(--font-xs); font-weight:600; padding:1px var(--space-2); border-radius:var(--radius-pill); white-space:nowrap; flex-shrink:0; }
.cat-chip.cat-warn       { color:var(--status-warn);  background:var(--warn-soft); }
.cat-chip.cat-primary    { color:var(--primary-strong); background:var(--primary-soft); }
.cat-chip.cat-danger     { color:var(--danger); background:var(--danger-soft); }
.cat-chip.cat-neutral    { color:var(--text-2); background:var(--surface-3); }
.item-timing { font-family:var(--font-mono); font-size:var(--font-xs); color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.item-acts { display:flex; align-items:center; gap:var(--space-1); margin-left:auto; flex-shrink:0; }
.item-msg { font-size:var(--font-sm); color:var(--text-1); word-break:break-word; }
.item-cur { font-size:var(--font-xs); color:var(--text-3); word-break:break-word; }
/* 结论 */
.concl-list { margin:var(--space-2) 0 0; padding-left:20px; font-size:var(--font-sm); color:var(--text-2); }
.concl-list li { margin:2px 0; }
/* 章节导读 —— 分节卡片，默认折叠 */
.sections-wrap { margin-top:var(--space-2); display:flex; flex-direction:column; gap:var(--space-2); }
.sections-wrap.closed { display:none; }
.section-card { border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-2); padding:var(--space-2) var(--space-3); }
.section-card-title { font-size:var(--font-sm); font-weight:600; color:var(--text-1); }
.section-card-note { font-size:var(--font-xs); color:var(--text-2); margin-top:2px; }
/* 伴生 / meta：尾部降级 */
.companions-list { margin:var(--space-1) 0 0; padding-left:20px; font-size:var(--font-xs); color:var(--text-3); }
.lb-meta { font-size:var(--font-xs); color:var(--text-3); }
.lb-companions .block-title { font-size:var(--font-xs); font-weight:600; color:var(--text-3); }
/* 快速试听浮层（底部固定条 · 三态 is-loading / is-ready / is-error） */
.audio-preview-bar {
    position:fixed; left:0; right:0; bottom:0; z-index:900;
    padding:var(--space-2) 14px; background:var(--surface); border-top:1px solid var(--border);
    display:none;
}
.audio-preview-bar.show { display:block; }
.audio-preview-error {
    display:none; align-items:flex-start; gap:var(--space-2);
    font-size:var(--font-xs); color:var(--danger); margin-bottom:var(--space-1);
}
.bar-error .audio-preview-error { display:flex; }
.audio-preview-main { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.audio-preview-timing { font-size:var(--font-xs); color:var(--text-2); white-space:nowrap; font-family:var(--font-mono); }
.audio-preview-main audio { flex:1; min-width:200px; height:32px; display:none; }
.bar-ready .audio-preview-main audio { display:block; }
.bar-loading .audio-preview-main audio, .bar-error .audio-preview-main audio { display:none; }
.preview-loading-note { display:none; align-items:center; gap:var(--space-2); font-size:var(--font-xs); color:var(--text-2); }
.bar-loading .preview-loading-note { display:flex; }
.preview-ready-note { display:none; align-items:center; gap:var(--space-2); font-size:var(--font-xs); }
.bar-ready .preview-ready-note { display:flex; }
.preview-ready-note .media-source-tag { padding:0 var(--space-2); }
.pv-close { margin-left:auto; }
/* 批处理确认框（AppModal.batchFixPreview · 复用 modal-lg flex column 配方） */
.modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000;
    align-items:center; justify-content:center;
}
.modal-overlay.active { display:flex; }
.modal-card {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md); max-width:min(760px, 92vw); width:92vw;
    max-height:88vh; display:flex; flex-direction:column; padding:var(--space-4) 20px 20px;
    animation:modal-slide-in .2s ease;
}
@keyframes modal-slide-in { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
.modal-title { font-size:16px; font-weight:650; margin-bottom:var(--space-2); }
.modal-body { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:var(--space-3); padding:0; }
.modal-actions { display:flex; justify-content:flex-end; gap:var(--space-2); margin-top:var(--space-4); flex-shrink:0; }
.bfp-meta { display:flex; flex-direction:column; gap:var(--space-1); flex-shrink:0; }
.bfp-meta-row { display:flex; align-items:center; gap:var(--space-2); font-size:var(--font-sm); color:var(--text-1); flex-wrap:wrap; }
.bfp-meta-row .meta-label { color:var(--text-3); flex-shrink:0; }
.bfp-meta-row.cloud { color:var(--status-warn); font-size:var(--font-xs); }
.bfp-meta-row.capnote { color:var(--status-warn); font-size:var(--font-xs); }
.bfp-cats { display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap; flex-shrink:0; }
.bfp-cat-chip { font-size:var(--font-xs); font-weight:600; padding:1px var(--space-2); border-radius:var(--radius-pill); }
.bfp-list { flex:1; min-height:0; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius-sm); padding:var(--space-1) 0; user-select:text; }
.bfp-item { display:flex; flex-direction:column; gap:var(--space-1); padding:var(--space-2) var(--space-3); border-bottom:1px solid var(--border); }
.bfp-item:last-child { border-bottom:none; }
.bfp-item-head { display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap; }
.bfp-idx { font-family:var(--font-mono); font-size:var(--font-xs); font-weight:600; color:var(--text-1); flex-shrink:0; }
.bfp-timing { font-family:var(--font-mono); font-size:var(--font-xs); color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.bfp-trunc { font-size:var(--font-xs); color:var(--text-3); font-weight:600; flex-shrink:0; }
.bfp-excerpt { font-size:var(--font-xs); color:var(--text-2); word-break:break-word; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
/* 响应式（618px 视口先例） */
@media (max-width: 768px) {
    .summary .media-source-bar { flex-basis:100%; max-width:100%; flex-wrap:wrap; }
    .section-content, .summary { padding-left:14px; padding-right:14px; }
    .audio-preview-main audio { min-width:160px; }
    .modal-card { width:96vw; max-height:92vh; }
    .bfp-excerpt { -webkit-line-clamp:4; }
}
</style>
</head>
<body>
<div class="proto-toolbar">
    <span class="proto-title">2.7.4 设计原型 · 导读页信息架构 + 批量修复确认（真实数据演示）</span>
    <span class="proto-demo-ctl">
        <span class="ctl-label">演示：</span>
        <button type="button" class="btn btn-sm btn-ghost" id="btnTheme">切深色/浅色</button>
        <button type="button" class="btn btn-sm btn-ghost" id="btnMsNone">媒体缺失</button>
        <button type="button" class="btn btn-sm btn-ghost" id="btnMsAuto">已自动匹配</button>
        <button type="button" class="btn btn-sm btn-ghost" id="btnMsManual">已手动指定</button>
        <button type="button" class="btn btn-sm btn-ghost" id="btnPvFail">试听失败态</button>
        <button type="button" class="btn btn-sm btn-ghost" id="btnBatch">批量修复确认框（35 条）</button>
    </span>
</div>

<div class="page-wrap">
    <div class="guide-page">
        <section class="section" id="guideCard">
            <div class="summary" id="guideSummary">
                <span class="guide-chevd" id="guideChevron"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
                <span class="section-title-text" id="guideTitle">质量报告导读</span>
                <div class="media-source-bar" id="mediaSourceBar">
                    <span class="media-source-label">媒体来源</span>
                    <span class="media-source-tag" id="mediaSourceTag"></span>
                    <span class="media-source-path" id="mediaSourcePath" title=""></span>
                    <button type="button" class="btn btn-ghost btn-sm" id="mediaSourceToggleBtn">更换</button>
                </div>
                <span class="proto-demo-ctl" style="margin-left:auto">
                    <button type="button" class="btn btn-ghost btn-sm"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>打开其他质量报告导读</button>
                    <button type="button" class="btn btn-ghost btn-sm">加载导读</button>
                </span>
            </div>
            <div class="section-content" id="guideContent">
                <div class="media-source-edit-row" id="mediaSourceEditRow" style="display:none">
                    <input type="text" class="form-input grow" id="mediaOverrideInput" placeholder="输入媒体文件完整路径（等价 --media-path，仅本报告会话内生效）" autocomplete="off">
                    <button type="button" class="btn btn-secondary btn-compact" id="mediaOverrideApplyBtn">应用</button>
                    <span class="muted" id="mediaOverrideStatus"></span>
                </div>
                <div class="status-line" id="guideStatusLine">
                    <span class="pv-ico-ok" id="guideStatusIcon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
                    <span class="status-path" id="guideStatusPath"></span>
                    <button type="button" class="btn btn-ghost btn-sm btn-icon-only copy-btn" id="copyPathBtn" title="复制路径"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
                </div>
                <div class="json-blocks" id="jsonBlocks">
                    <div class="lb-items">
                        <div class="block-head"><h4 class="block-title main" style="margin:0">行动条目</h4><span class="count-chip" id="itemCount">—</span></div>
                        <div class="items-list" id="itemsList"></div>
                    </div>
                    <div class="lb-concl">
                        <div class="block-head"><h4 class="block-title" style="margin:0">结论</h4><span class="count-chip" id="conclCount">—</span></div>
                        <ul class="concl-list" id="conclList"></ul>
                    </div>
                    <div class="lb-sections">
                        <div class="block-head"><h4 class="block-title" style="margin:0">章节导读</h4><span class="count-chip" id="sectCount">—</span><button type="button" class="sect-toggle" id="sectToggle" title="折叠/展开"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>

  fastIdx.forEach((n, i) => {
    add(n, 'cps_too_fast', T(0, 2 + i, 14, 5 + i, 17),
      n === 65 ? LONG : '对白语速过快，字幕停留过短，建议断行或放慢中译节奏。',
      n === 65);
  });
  // untranslated 14 条

  unIdx.forEach((n, i) => {
    add(n, 'untranslated', T(0, 8 + i, 41, 11 + i, 44),

  });
  // antonym_yamete 1 条
  add(133, 'antonym_yamete', T(0, 11, 5, 14, 8), '反义句误译：「やめて」被译作肯定语气，应取否定义。');
