# =============================================================================
# SubTrans - pyproject.toml
# =============================================================================
# 通用字幕翻译工具（净语翻译两阶段流水线（v2））。
#
# 安装：
#   pip install -e .            # 核心翻译引擎（refine CLI 所需）
#   pip install -e ".[gui]"     # 桌面 GUI（pywebview）
# =============================================================================

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtrans"
version = "3.1.4.dev0"
description = "Standalone two-stage (v2) SRT subtitle translation toolkit (net-speech refine pipeline)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "MeiZhong"}]
requires-python = ">=3.10,<3.14"
keywords = ["subtitle", "srt", "translation", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# 翻译引擎核心依赖（refine v2 两阶段流水线 + OpenAI 兼容通道）
dependencies = [
    "openai>=1.35.0,<3.39",   # OpenAI 兼容接口（deepseek/zen/lmstudio/siliconflow/custom）；3.38 失配已适配（5974144 分类器三源判定＋本批消息保留 _model_unloaded_detail），worktree fresh 3.38.0 全量实证绿（D2026-1028-05 B1）；上界钉保留——上游响应形态再变即静默失配，fresh 腿随上游漂移不可控
    "httpx>=0.27",            # llm_client O6 回环直连客户端（translate/llm_client.py）
    "requests",
    "regex",                  # 正则引擎（deletion_patch 直接 import）
    "pyyaml>=6.0",
    "opencc-python-reimplemented>=0.1.7",
    "psutil>=5.9",              # 进程树管理（terminate_process_tree 等核心模块）
    "sudachipy>=0.7.0,<0.8",    # 0.6.x 加载 v1 词典（20260723）Invalid header 静默失败，0.7.0 实证 LOAD_OK
    "pysubs2>=1.8,<1.9",  # 批2 多格式导入（D2026-1003-05 画押⑤：1.9+ 需 py≥3.12 与本项目冲突，钉 <1.9）
]

[project.optional-dependencies]
gui = [
    "pywebview>=6.2,<7",  # 2.7.5 件A（D2026-1007-02）：钉 6.2+ 对齐 as_uri file:// 媒体通道口径
    "pythonnet>=3.0; sys_platform == 'win32'",
]
# 中文分词提示（2.1，D2026-0930-03 ④）：可选组件，缺失走静默降级
zh = [
    "jieba>=0.42",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy==2.4.1",
    "ruff>=0.6",
]

[tool.mypy]
python_version = "3.12"
# 钉产品主口径平台（Windows）：CI 与本地单轨一致——linux 平台 typeshed 把
# msvcrt/winreg/ctypes.windll 属性锁在 sys.platform=="win32" 护栏内，不钉
# 会产生平台噪声 attr-defined 假报（2026-09-26 CI 首跑实测，ubuntu 腿 9 条）。
platform = "win32"
ignore_missing_imports = true
check_untyped_defs = true
no_strict_optional = true
exclude = ["build", "Temp"]

# D2026-1030-07 补卡池白名单第 5 类：严格度扩面（只增不减口径）。
# 纯逻辑模块先纳入 strict，防止注解退化为 Any；新增模块按同形态追加。
# 注 1：mypy 2.3.1 的 `strict = true` 写在 overrides 内会触发全局
# set_strict_flags()，把 strict 泄漏到全包（实测 954 条噪声），故按
# `--strict` 等价旗标显式展开。
# 注 2：warn_redundant_casts 在本版 PER_MODULE_OPTIONS 之外，无法按模块设；
# strict_optional 按 `--strict` 定义本就不含，且本版 per-module 开启后会把
# 省略 start 的切片（如 s[:n]）全判假错，故不设（全局 no_strict_optional
# 维持现状）。
[[tool.mypy.overrides]]
module = [
    "subtrans.refine.pass_merge",
    "subtrans.refine.pass_disagreement",
    "subtrans.refine.line_breaker",
    "subtrans.refine.artifact_lock",
    "subtrans.refine.srt_encoding",
    "subtrans.webview_gui.security",
    "subtrans.webview_gui.user_dirs",
    "subtrans.webview_gui.encode_queue",
    "subtrans.webview_gui.event_stream",
    "subtrans.utils.process_manager",
    "subtrans.refine.garble_detect",
    "subtrans.refine.quality_advisor",
    "subtrans.refine.glossary_learn",
    "subtrans.refine.grammar_hint",
    "subtrans.refine.v2_learn",
    "subtrans.refine.dialogue_detect",
    "subtrans.refine.kana_clean",
    "subtrans.refine.post_validate",
    "subtrans.refine.source_hallucination",
    "subtrans.refine.filters",
    "subtrans.refine.output_formats",
    "subtrans.refine.token_hint",
    "subtrans.refine.rules_loader",
    "subtrans.refine.audio_detect",
    "subtrans.refine.subtitle_convert",
    "subtrans.refine.v2_context_blocks",
    "subtrans.refine.v2_rules",
    "subtrans.refine.risk",
    "subtrans.refine.eval_baseline",
    # D2026-1106 自检轮扩面：全包 81 模块 strict 口径探测下已零违规、却未受强制的
    # 12 件一次性纳入（纯配置改动，无代码变更；探测法存内部记录）。
    # 探测同时确认既有 29 件在 strict 等价旗标下全部零违规＝清单口径无漂移。
    "subtrans.__init__",
    "subtrans.__version__",
    "subtrans.paths",
    "subtrans.refine.__init__",
    "subtrans.refine.template_seed",
    "subtrans.translate.__init__",
    "subtrans.translate.providers",
    "subtrans.utils.__init__",
    "subtrans.utils.console",
    "subtrans.utils.model_cache",
    "subtrans.utils.subprocess_flags",
    "subtrans.webview_gui.__init__",
    # 段11 strict 修债：1 条级模块修一条入名单一件（只增不减）。
    "subtrans.data_migration",
    "subtrans.refine.__main__",
    "subtrans.refine.aggregate_stats",
    "subtrans.refine.batch",
    "subtrans.refine.fs_utils",
    "subtrans.webview_gui.strings",
    # 段12 strict 修债：3–6 条级模块（探测排序实测）修一件入名单一件，只增不减。
    "subtrans.refine.events",
    "subtrans.refine.hardsub",
    "subtrans.refine.cleaner_rules",
    "subtrans.refine.secrets",
    "subtrans.refine.quality_autoloop",
    "subtrans.refine.instructions",
    # 段13 strict 修债：7–9 条级模块（探测排序实测）修一件入名单一件，只增不减。
    "subtrans.refine.language_validator",
    "subtrans.utils.lmstudio",
    "subtrans.refine.glossary",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[project.scripts]
subtrans-refine = "subtrans.refine.cli:main"
subtrans-gui = "subtrans.webview_gui.main:main"

# -----------------------------------------------------------------------------
# Setuptools Configuration
# -----------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["subtrans*"]
exclude = ["tests*", "config*", "models*"]

[tool.setuptools.package-data]
"subtrans.webview_gui" = ["assets/*.html", "assets/*.css", "assets/*.js", "assets/*.ico"]
"subtrans.refine" = ["defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gui: 需要 pywebview（gui extra）的用例"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".tmp"]   # pytest --basetemp 约定目录（测试夹具残留不入检查面）

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
