# 7b③ 受限探针（D2026-0925-03 定案二；v1.3.2 任务5 二次评审转 B-月级，2026-09-27）。
# 性质：开发者探针（CI 侧），非用户功能；月级定时（schedule + workflow_dispatch），不进 required checks，不阻塞 PR/Release。
# kill-criterion（2026-09-27 刷新）：import webview 抛错即弃；GUI 收集面以 tests/test_gui_api 用例数为准（全量基线随主口径滚动，不在此钉死具体数字防漂移假红；探针仅断言 GUI 收集数 >= 1）；1 次失败即弃腿。
# 失败处置：月级失败先手动复跑（workflow_dispatch）确认，确认环境漂移再修本 workflow 或临时提频。
# 升级条件（满足其一可评估升格为 required/更高频率）：外部 PR 增多（不再单一活跃提交者）/ 进入发布稳定期需更强 CI 保障 / GUI 依赖或测试收集面频繁变动致月级滞后。
name: gui-probe
on:
  schedule:
    # UTC 每月 1 日 03:17（北京时间 11:17）；错峰避开整点——2026-10-01 整点首跳未触发（实证），整点丢弃为推断（D2026-1001-03）
    - cron: "17 3 1 * *"
  workflow_dispatch:

jobs:
  gui-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # GUI 依赖安装失败即红
      - name: Install (dev + gui extra)
        run: pip install -e ".[dev,gui]"
      # 显式 import 探针（kill-criterion：import webview 抛 RuntimeError 即弃）
      - name: Import probe (webview)
        shell: bash
        run: |
          python -c "import webview" || { echo "::error::GUI 依赖安装后仍无法 import webview（pywebview 不可用）"; exit 1; }
      # GUI 测试面收集断言：collected 须 >= 1，不钉死具体数字（防基线漂移假红）
      - name: Collect gui-facing tests (assert collected >= 1)
        shell: bash
        run: |
          OUT=$(python -m pytest tests/test_gui_api.py --collect-only -q 2>&1) || true
          echo "$OUT"
          COUNT=$(printf '%s\n' "$OUT" | grep -oE "[0-9]+ tests? collected" | grep -oE "^[0-9]+" | head -n 1 || true)
          if [ -z "$COUNT" ]; then
            echo "::error::GUI 测试面收集断言失败：输出中未找到 '<N> tests collected' 行（收集面为空或收集报错，见上方日志）"
            exit 1
          fi
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::GUI 测试面收集数为 $COUNT，须 >= 1"
            exit 1
          fi
          echo "GUI 面收集数 = $COUNT（基线随主口径滚动，不在此钉死）"
      # 实跑：失败即红
      - name: Run gui-facing tests
        run: python -m pytest tests/test_gui_api.py -q
