# SubTransJAV 发布构建草稿（D2026-0929-05 P2/07 定案）
#
# 运行时验证依赖：pythonnet 需要宿主机 .NET runtime（hostfxr.dll），
# CI 只能证明"能打包"，真机核验（GUI 启动、WebView2 加载、翻译链路）
# 必须在 Windows 10/11 目标机上完成后方可发布。
#
# D2026-0929-07 点 7：tag 触发已于 run 36522842977 全链验证后启用。

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 1.0.0），将写入 Inno 产物文件名"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8:replace"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) { $v = $env:GITHUB_REF_NAME -replace '^v','' }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller

      - name: Build with PyInstaller (单产物，词典不进包)
        run: >
          python -m PyInstaller packaging/SubTransJAV.spec
          --noconfirm --distpath Temp/pyinstaller_dist --workpath Temp/pyinstaller_work

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: cmd
        run: >-
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /Dversion=%VERSION%
          packaging\setup.iss

      - name: Smoke check key artifacts
        shell: pwsh
        run: |
          $root = "Temp/pyinstaller_dist/SubTransJAV"
          $paths = @(
            "$root/SubTransJAV.exe",
            "$root/_internal/webview_gui_assets/index.html",
            "$root/_internal/subtransjav/refine/defaults/translation_rules.yaml",
            "$root/_internal/webview/lib/runtimes/win-x64/native/WebView2Loader.dll",
            "$root/_internal/pythonnet/runtime/Python.Runtime.dll",
            "$root/subtrans-cli.exe"
          )
          foreach ($p in $paths) {
            if (-not (Test-Path $p)) { Write-Error "MISSING artifact: $p"; exit 1 }
          }
          # 去捆绑断言（D3，D2026-1001）：产物不含 system.dic（词典经引擎页按需下载）
          if (Test-Path "$root/_internal/sudachidict_core/resources/system.dic") {
            Write-Error "dist must NOT contain system.dic (词典去捆绑口径)"; exit 1
          }
          # 体积下限断言：防静默空包（去词典后 onedir 总量约 33MB 量级，下限放宽）
          $total = (Get-ChildItem $root -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "onedir total = $([math]::Round($total/1MB,1)) MB"
          if ($total -lt 20MB) { Write-Error "onedir too small: $total bytes"; exit 1 }

      # 2.0.0 双 EXE：CLI 冒烟改走独立 subtrans-cli.exe（console 版，无头可跑）。
      # GUI exe（SubTransJAV.exe）为 windowed 子系统：无头环境启动无可见输出、
      # 无法做 stdout 断言，仅做 Test-Path 存在性检查，GUI 真机验收归安装反馈轮。
      - name: Smoke check subtrans-cli.exe (CLI semantics, headless)
        shell: pwsh
        run: |
          $root = "Temp/pyinstaller_dist/SubTransJAV"
          $cli = "$root/subtrans-cli.exe"
          if (-not (Test-Path $cli)) { Write-Error "MISSING artifact: $cli"; exit 1 }
          # 数据根隔离：全程不触碰 CI 真实 %LOCALAPPDATA%
          $env:SUBTRANSJAV_DATA_ROOT = "$PWD/Temp/cli_smoke_data"
          # 1) --help 含 --where
          $help = (& $cli --help 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Error "subtrans-cli --help rc=$LASTEXITCODE"; exit 1 }
          if (-not $help.Contains("--where")) { Write-Error "--help output missing --where"; exit 1 }
          # 2) --where 九字段（九行非空输出）
          $where = (& $cli --where 2>&1) | Where-Object { $_ -and $_.Trim() }
          if ($LASTEXITCODE -ne 0) { Write-Error "subtrans-cli --where rc=$LASTEXITCODE"; exit 1 }
          Write-Host "$($where -join "`n")"
          if (@($where).Count -lt 9) { Write-Error "--where expected 9 fields, got $(@($where).Count)"; exit 1 }
          # 3) --dry-run 全链 rc=0（本地档位，无需 API Key；SRT 夹具现场生成）
          New-Item -ItemType Directory -Force -Path "Temp/cli_smoke_data/in" | Out-Null
          $srt = "Temp/cli_smoke_data/in/smoke.srt"
          @("1", "00:00:01,000 --> 00:00:02,000", "スモークテスト", "") |
            Set-Content $srt -Encoding UTF8
          & $cli -i $srt `
            --s1-provider lmstudio --s1-model smoke-model `
            --s3-provider lmstudio --s3-model smoke-model `
            --dry-run
          if ($LASTEXITCODE -ne 0) { Write-Error "subtrans-cli --dry-run rc=$LASTEXITCODE"; exit 1 }
          Write-Host "subtrans-cli smoke: --help / --where(9) / --dry-run all rc=0"

      - name: Generate SHA256 manifest
        shell: pwsh
        run: |
          $out = "Temp/innoinstall"
          Get-ChildItem $out -Filter "SubTransJAV-setup-*.exe" | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)"
          } | Set-Content "$out/SHA256SUMS.txt"
          Get-Content "$out/SHA256SUMS.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SubTransJAV-${{ env.VERSION }}
          path: |
            Temp/pyinstaller_dist/SubTransJAV/**
            Temp/innoinstall/*.exe
            Temp/innoinstall/SHA256SUMS.txt
          if-no-files-found: error

# D2026-0929-07 点 7：tag 触发已启用（push: tags: v*），
# 已于 run 36522842977 手动全链验证通过。
