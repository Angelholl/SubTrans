name: CI
on:
  push:
    branches: [main, master, 'refactor/**']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: line-endings
        shell: bash
        run: if grep -rlU $'\r' --include='*.py' --include='*.yaml' subtrans config tests; then echo "::error::CRLF line endings detected"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # [dev,zh]：额外拉入 jieba（zh extra），否则 tests/test_token_hint.py 的
      # jieba 正向用例在 CI 恒 skip（D2026-1004-01）
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev,zh]" && pip install "mypy==2.3.1"
      - name: Lint
        run: ruff check subtrans tests
      # mypy 基线门禁（D9，1.3.1 收口：去 || true，基线外错误即阻断）
      - name: Type check (baseline gate)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python tools/mypy_baseline.py --check
      # 禁推守卫独立步骤（D2026-1106-06 拍板 CI 化）：防泄漏面由「本地手动＋
      # tracked 核对测试（随 pytest 进 CI）」再加一层脚本直跑；正向契约兼容
      # CI 无 decision-log 的形态（D2026-1106-05 建守卫时已内置）
      - name: Banned-paths guard
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python tools/guard_banned_paths.py
      - name: Test
        shell: bash
        run: |
          set +e +o pipefail
          python -m pytest tests -q --cov=subtrans --cov-report=term 2>&1 | tee /tmp/pytest_ci.log
          rc=${PIPESTATUS[0]}
          grep -E "^FAILED" /tmp/pytest_ci.log | head -30 | while IFS= read -r line; do
            echo "::error title=FAILED::${line#FAILED }"
          done
          exit $rc
